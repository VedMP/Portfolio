<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="geminiGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2980F5"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="256" cy="256" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Radiant 4-pointed Gemini starburst -->
  <path
    d="M 256 32 C 256 155.7 356.3 256 480 256 C 356.3 256 256 356.3 256 480 C 256 356.3 155.7 256 32 256 C 155.7 256 256 155.7 256 32 Z"
    fill="url(#geminiGrad)"
    filter="url(#subtleGlow)"
  />

  <!-- Subtle luminous core -->
  <path
    d="M 256 120 C 256 195 317 256 392 256 C 317 256 256 317 256 392 C 256 317 195 256 120 256 C 195 256 256 195 256 120 Z"
    fill="url(#centerGlow)"
  />

  <!-- Brilliant center spark point -->
  <circle cx="256" cy="256" r="12" fill="#FFFFFF" fill-opacity="0.9"/>
</svg>
